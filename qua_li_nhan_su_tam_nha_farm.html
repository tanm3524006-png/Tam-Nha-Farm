<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sơ Đồ Nhân Sự - Tâm Nha Farm</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        :root {
            --bg-body: #F4F7F2;
            --primary-color: #1A5319;
            --accent-color: #80AF81;
            --highlight-color: #508D4E;
            --text-dark: #0A260A;
            --text-light: #555;
            --card-bg: #ffffff;
            --line-color: #C8E6C9;
            --font-main: 'Lexend', sans-serif;
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-body);
            color: var(--text-dark);
            margin: 0; padding: 0;
            overflow: hidden; /* Khóa cuộn body để xử lý zoom/pan thủ công */
            height: 100vh;
            width: 100vw;
        }

        /* --- HEADER RESPONSIVE --- */
        header {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 30px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        header h1 {
            margin: 0; font-size: 20px; font-weight: 600;
            color: var(--primary-color); display: flex; align-items: center; gap: 10px;
        }
        header .subtitle { font-size: 13px; color: var(--text-light); margin-top: 2px; }
        .header-right { font-size: 13px; color: var(--text-light); }

        /* Mobile Header tweak */
        @media (max-width: 768px) {
            header { padding: 10px 15px; flex-direction: column; align-items: flex-start; gap: 5px; }
            header h1 { font-size: 16px; }
            .header-right { display: none; } /* Ẩn dòng credit trên mobile cho gọn */
        }

        /* --- VÙNG HIỂN THỊ CHÍNH (VIEWPORT) --- */
        #viewport {
            width: 100%;
            height: 100%;
            overflow: hidden; /* Ẩn thanh cuộn mặc định */
            cursor: grab;
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCIgdmlld0JveD0iMCAwIDQwIDQwIj48ZyBmaWxsLXJ1bGU9ImV2ZW5vZGQiPjxnIGZpbGw9IiM4MEFGODIiIGZpbGwtb3BhY2l0eT0iMC4wNSI+PHBhdGggZD0iTDAgMGg0MHY0MEgwVjB6bTIwIDIwaDIwdjIwSDIWMjB6TTAgMjBoMjB2MjBIMFYyMHoyMCAwaDIwdjIwSDIwVjB6Ii8+PC9nPjwvZz48L3N2Zz4=');
            display: flex;
            justify-content: center; /* Căn giữa ban đầu */
            align-items: center;
        }
        #viewport:active { cursor: grabbing; }

        /* Container chứa sơ đồ (để Zoom/Pan) */
        #transform-container {
            transform-origin: 0 0; /* Gốc tọa độ biến hình */
            transition: transform 0.1s linear; /* Hiệu ứng mượt nhẹ */
            display: inline-block;
        }

        /* --- CONTROLS (ZOOM) --- */
        .controls {
            position: fixed; bottom: 30px; right: 30px; z-index: 101;
            display: flex; flex-direction: column; gap: 10px;
        }
        .btn-control {
            width: 45px; height: 45px; border-radius: 50%;
            background: white; border: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            color: var(--primary-color); font-size: 18px;
            cursor: pointer; display: flex; justify-content: center; align-items: center;
            transition: 0.2s;
        }
        .btn-control:active { transform: scale(0.9); background: var(--bg-body); }
        .btn-control:hover { color: var(--accent-color); }

        /* --- TREE CSS (GIỮ NGUYÊN) --- */
        .tree { display: flex; padding: 50px; }
        .tree ul {
            padding-left: 60px; position: relative;
            display: flex; flex-direction: column; justify-content: center; margin: 0;
        }
        .tree li {
            list-style-type: none; position: relative; padding: 15px 0;
            display: flex; align-items: center;
        }

        /* Card styles responsive tweak */
        .card {
            background: var(--card-bg); width: 240px; border-radius: 12px; padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02), 0 10px 20px rgba(26,83,25,0.05);
            border: 1px solid rgba(200,230,201,0.5);
            display: flex; flex-direction: column; align-items: center; text-align: center;
            position: relative; z-index: 10;
        }
        /* Mobile: Card nhỏ hơn chút */
        @media (max-width: 768px) {
            .card { width: 200px; padding: 12px; }
            .card h3 { font-size: 15px; }
            .tree ul { padding-left: 40px; } /* Thu ngắn dây nối */
        }

        .avatar-wrapper {
            width: 70px; height: 70px; border-radius: 50%; padding: 3px;
            background: linear-gradient(135deg, var(--accent-color), var(--primary-color));
            margin-bottom: 10px;
        }
        .card img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid white; }
        .card h3 { margin: 0; font-size: 16px; font-weight: 600; color: var(--primary-color); }
        .card .role {
            font-size: 11px; color: white; background: var(--highlight-color);
            padding: 3px 10px; border-radius: 15px; margin: 5px 0 10px 0; text-transform: uppercase;
        }
        .card .bio {
            font-size: 12px; color: var(--text-light); margin: 0 0 10px 0; padding-top: 8px;
            border-top: 1px solid #f0f0f0; width: 100%;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }

        .contact-bar { display: flex; gap: 5px; justify-content: center; width: 100%; }
        .contact-btn {
            width: 32px; height: 32px; border-radius: 8px;
            display: flex; justify-content: center; align-items: center; font-size: 14px;
            background: #f5f5f5; color: var(--highlight-color); text-decoration: none;
        }
        .contact-bar:empty { display: none; }

        /* Lines CSS */
        .tree li::before {
            content: ''; position: absolute; left: 0; top: 50%;
            border-top: 2px solid var(--line-color); width: 60px; height: 0; transform: translateY(-50%); z-index: 1;
        }
        @media (max-width: 768px) { .tree li::before { width: 40px; } }

        .tree ul ul::after {
            content: ''; position: absolute; left: 0; top: 15px; bottom: 15px;
            border-left: 2px solid var(--line-color); width: 0; z-index: 1;
        }
        .tree ul ul li:first-child::before { border-left: 2px solid var(--line-color); border-top-left-radius: 10px; height: 50%; top: 50%; transform: none; }
        .tree ul ul li:last-child::before { border-left: 2px solid var(--line-color); border-bottom-left-radius: 10px; height: 50%; top: 0; transform: none; border-top: 2px solid var(--line-color); }
        .tree ul ul li:only-child::before { border-radius: 0; border-left: none; height: 0; top: 50%; transform: translateY(-50%); border-top: 2px solid var(--line-color); }
        .tree > ul > li::before { display: none; }
        .tree .card + ul::before {
            content: ''; position: absolute; left: -60px; top: 50%;
            border-top: 2px solid var(--line-color); width: 60px; height: 0; transform: translateY(-50%);
        }
        @media (max-width: 768px) { .tree .card + ul::before { left: -40px; width: 40px; } }

        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-body); z-index: 200;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: var(--primary-color);
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <i class="fas fa-seedling fa-spin" style="font-size: 40px; margin-bottom: 15px;"></i>
        <div>Đang tải dữ liệu...</div>
    </div>

    <header>
        <div>
            <h1><i class="fas fa-leaf" style="color: var(--accent-color);"></i> Tâm Nha Farm</h1>
            <div class="subtitle">Sơ đồ tổ chức nhân sự</div>
        </div>
        <div class="header-right">Cập nhật từ Google Sheets</div>
    </header>

    <div id="viewport">
        <div id="transform-container">
            <div class="tree" id="tree-root"></div>
        </div>
    </div>

    <div class="controls">
        <button class="btn-control" onclick="resetView()"><i class="fas fa-compress-arrows-alt"></i></button>
        <button class="btn-control" onclick="zoom(0.1)"><i class="fas fa-plus"></i></button>
        <button class="btn-control" onclick="zoom(-0.1)"><i class="fas fa-minus"></i></button>
    </div>

    <script>
    // ==========================================
    // Dán link Web App bạn vừa copy ở Bước 2 vào đây
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby2jLD6xOClJDExaCGmeU5mSe-IYM7iHXACgCueR4H9anxIqLY1HY0ZQpbBU52b_OpHdQ/exec'; 
    // ==========================================

    const fakeData = [
        { id: "1", name: "Trần Tâm Nha", role: "CEO", manager_id: "", image: "", phone: "0901234567" },
        { id: "2", name: "Quản Lý A", role: "Manager", manager_id: "1", image: "" }
    ];

    function init() {
        document.getElementById('loading-screen').style.display = 'flex';
        
        // Kiểm tra xem đã thay link chưa
        if (APPS_SCRIPT_URL.includes('AKfycb')) { 
            // Dùng fetch để gọi API Apps Script
            fetch(APPS_SCRIPT_URL)
                .then(response => {
                    return response.json(); // Apps Script trả về JSON chuẩn
                })
                .then(data => {
                    console.log("Dữ liệu tải về:", data);
                    processAndRender(data);
                })
                .catch(err => {
                    console.error("Lỗi:", err);
                    alert("Không tải được dữ liệu. Kiểm tra lại Link Apps Script!");
                    processAndRender(fakeData);
                });
        } else {
             console.warn("Chưa điền Link Apps Script.");
             processAndRender(fakeData);
        }
    }

    // --- GIỮ NGUYÊN TẤT CẢ CÁC HÀM BÊN DƯỚI (processAndRender, renderTreeHTML, Zoom, Pan...) ---
    
    function processAndRender(flatData) {
        const treeData = buildHierarchy(flatData);
        document.getElementById('tree-root').innerHTML = renderTreeHTML(treeData);
        setTimeout(() => { document.getElementById('loading-screen').style.display = 'none'; }, 500);
        centerChart();
    }

    function buildHierarchy(flatList) {
        const root = []; const map = {};
        flatList.forEach(node => { 
            if(node.id) { 
                node.children = []; 
                node.name = node.name || "Không tên";
                map[node.id] = node; 
            } 
        });
        flatList.forEach(node => {
            if(node.id) {
                if (node.manager_id && map[node.manager_id]) map[node.manager_id].children.push(node);
                else root.push(node);
            }
        });
        return root;
    }

    const isNotEmpty = (str) => str && str.toString().trim() !== "";

    function renderTreeHTML(nodes) {
        if (!nodes || nodes.length === 0) return '';
        let html = '<ul>';
        nodes.forEach(node => {
            const avatar = isNotEmpty(node.image) ? node.image : `https://ui-avatars.com/api/?name=${encodeURIComponent(node.name)}&background=80AF81&color=fff&size=128`;
            
            let contactHtml = '';
            if(isNotEmpty(node.phone)) contactHtml += `<a href="tel:${node.phone}" class="contact-btn"><i class="fas fa-phone"></i></a>`;
            if(isNotEmpty(node.zalo)) contactHtml += `<a href="${node.zalo.toString().startsWith('http')?node.zalo:'https://zalo.me/'+node.zalo}" target="_blank" class="contact-btn"><i class="fas fa-comment-dots"></i></a>`;
            if(isNotEmpty(node.facebook)) contactHtml += `<a href="${node.facebook}" target="_blank" class="contact-btn"><i class="fab fa-facebook-f"></i></a>`;

            html += `
                <li>
                    <div class="card">
                        <div class="avatar-wrapper"><img src="${avatar}"></div>
                        <h3>${node.name}</h3>
                        <div class="role">${node.role}</div>
                        ${isNotEmpty(node.bio) ? `<div class="bio">${node.bio}</div>` : ''}
                        <div class="contact-bar">${contactHtml}</div>
                    </div>
                    ${renderTreeHTML(node.children)}
                </li>
            `;
        });
        return html + '</ul>';
    }

    // --- LOGIC ZOOM & PAN (GIỮ NGUYÊN NHƯ CŨ) ---
    let scale = 1; let panning = false; let pointX = 0; let pointY = 0; let startX = 0; let startY = 0;
    const viewport = document.getElementById('viewport');
    const container = document.getElementById('transform-container');

    function setTransform() { container.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`; }
    function zoom(amount) { scale += amount; if (scale < 0.2) scale = 0.2; if (scale > 3) scale = 3; setTransform(); }
    function resetView() { scale = 1; pointX = 0; pointY = 0; centerChart(); }
    function centerChart() {
        if (window.innerWidth < 768) scale = 0.6; else scale = 1;
        pointX = 0; pointY = 0; setTransform();
    }

    viewport.addEventListener('mousedown', (e) => { if (e.target.closest('.card') || e.target.closest('button')) return; e.preventDefault(); startX = e.clientX - pointX; startY = e.clientY - pointY; panning = true; viewport.style.cursor = 'grabbing'; });
    viewport.addEventListener('mouseup', () => { panning = false; viewport.style.cursor = 'grab'; });
    viewport.addEventListener('mousemove', (e) => { if (!panning) return; e.preventDefault(); pointX = e.clientX - startX; pointY = e.clientY - startY; setTransform(); });
    viewport.addEventListener('touchstart', (e) => { if (e.target.closest('.card') || e.target.closest('button')) return; if (e.touches.length === 1) { startX = e.touches[0].clientX - pointX; startY = e.touches[0].clientY - pointY; panning = true; } });
    viewport.addEventListener('touchend', () => { panning = false; });
    viewport.addEventListener('touchmove', (e) => { if (!panning || e.touches.length !== 1) return; if (e.cancelable) e.preventDefault(); pointX = e.touches[0].clientX - startX; pointY = e.touches[0].clientY - startY; setTransform(); });
    viewport.addEventListener('wheel', (e) => { if (e.ctrlKey) { e.preventDefault(); const xs = (e.clientX - pointX) / scale; const ys = (e.clientY - pointY) / scale; const delta = -e.deltaY; (delta > 0) ? (scale *= 1.1) : (scale /= 1.1); pointX = e.clientX - xs * scale; pointY = e.clientY - ys * scale; setTransform(); } }, { passive: false });

    init();
</script>
</body>
</html>
